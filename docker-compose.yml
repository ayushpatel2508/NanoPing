services:
  db:
    image: postgres:16
    container_name: pinging-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRE_USER}
      - POSTGRES_PASSWORD=${POSTGRE_PASSWORD}
      - POSTGRES_DB=${POSTGRE_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pinging-pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - db

  redis:
    image: redis:alpine
    container_name: pinging-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    container_name: pinging-backend
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRE_USER}:${POSTGRE_PASSWORD}@db:5432/${POSTGRE_DB}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    command: /bin/sh -c "npm install && npx prisma db push --accept-data-loss && npm run dev"
